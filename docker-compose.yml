version: "3.9"

# NYC Airbnb Price Prediction — distributed production stack
#
# Services:
#   api    — FastAPI + ONNX Runtime + gunicorn (4 workers)
#   nginx  — SSL termination, per-IP rate limiting, load balancer
#
# Usage:
#   docker compose up --build           # start everything
#   docker compose up --scale api=3     # 3 API replicas behind Nginx
#   docker compose down                 # stop and remove containers

services:

  # ── Redis (cache + DLQ) ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── MLflow tracking server ─────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    restart: unless-stopped
    command: >
      bash -c "pip install --quiet mlflow>=2.0.0 &&
               mlflow server
                 --backend-store-uri sqlite:///mlflow/mlflow.db
                 --default-artifact-root /mlflow/artifacts
                 --host 0.0.0.0
                 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── API service ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      GUNICORN_WORKERS: 4
      RATE_LIMIT: "60/minute"
      LOG_LEVEL: info
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_TTL_SECONDS: "300"
      PREDICTION_DB: /app/data/predictions.db
      DLQ_MAX_SIZE: "10000"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_UI_URL: http://localhost:5000
      # OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./models/nyc:/app/models/nyc:ro
      - predictions_data:/app/data          # persist SQLite across restarts
    expose:
      - "8001"                      # internal only — Nginx is the public face
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"      # HTTP → redirect to HTTPS
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend:
    driver: bridge

volumes:
  predictions_data:    # named volume — survives container restarts
  mlflow_data:         # MLflow SQLite DB + artifact store
