version: "3.9"

# NYC Airbnb Price Prediction — distributed production stack
#
# Services:
#   api    — FastAPI + ONNX Runtime + gunicorn (4 workers)
#   nginx  — SSL termination, per-IP rate limiting, load balancer
#
# Usage:
#   docker compose up --build           # start everything
#   docker compose up --scale api=3     # 3 API replicas behind Nginx
#   docker compose down                 # stop and remove containers

services:

  # ── Redis (cache + DLQ) ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── MLflow tracking server ─────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    restart: unless-stopped
    command: >
      bash -c "pip install --quiet mlflow>=2.0.0 &&
               mlflow server
                 --backend-store-uri sqlite:///mlflow/mlflow.db
                 --default-artifact-root /mlflow/artifacts
                 --host 0.0.0.0
                 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Fluent Bit — log shipper ─────────────────────────────────────────────────
  fluent-bit:
    image: fluent/fluent-bit:3.1
    restart: unless-stopped
    ports:
      - "24224:24224"       # forward protocol (Docker log driver)
      - "24224:24224/udp"
      - "2020:2020"         # Fluent Bit health/metrics endpoint
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
    environment:
      DD_API_KEY:     ${DD_API_KEY:-}
      DD_SERVICE:     ${DD_SERVICE:-nyc-api}
      DD_ENV:         ${DD_ENV:-prod}
      DD_INTAKE_HOST: ${DD_INTAKE_HOST:-http-intake.logs.datadoghq.com}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2020/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── API service ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      fluent-bit:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"     # non-blocking: container starts even if Fluent Bit is briefly down
        tag: "nyc-api.{{.ID}}"
    environment:
      PYTHONPATH: /app
      GUNICORN_WORKERS: 4
      RATE_LIMIT: "60/minute"
      LOG_LEVEL: info
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_TTL_SECONDS: "300"
      PREDICTION_DB: /app/data/predictions.db
      DLQ_MAX_SIZE: "10000"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_UI_URL: http://localhost:5000
      # OTLP_ENDPOINT: http://otel-collector:4317
      GROUND_TRUTH_INGEST_TOKEN: ${GROUND_TRUTH_INGEST_TOKEN:-}   # unset = /ground-truth/ingest disabled (503)
      VALID_API_KEYS: ${VALID_API_KEYS:-}    # comma-separated; unset = auth disabled (dev default)
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}              # unset = Slack delivery disabled
      SLACK_CRITICAL_CHANNEL: ${SLACK_CRITICAL_CHANNEL:-}   # e.g. #incidents; unset = webhook default
    volumes:
      - ./models/nyc:/app/models/nyc:ro
      - predictions_data:/app/data          # persist SQLite across restarts
    expose:
      - "8001"                      # internal only — Nginx is the public face
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"      # HTTP → redirect to HTTPS
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus Pushgateway — retrain job metrics ────────────────────────────
  pushgateway:
    image: prom/pushgateway:v1.8.0
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Prometheus — metrics store ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"      # POST /-/reload to hot-reload config
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Grafana — dashboards ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "3001:3000"     # browse to http://localhost:3001  (admin / admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  backend:
    driver: bridge

volumes:
  predictions_data:    # named volume — survives container restarts
  mlflow_data:         # MLflow SQLite DB + artifact store
  prometheus_data:     # Prometheus TSDB (30-day retention)
  grafana_data:        # Grafana state (dashboards, users, alerts)
