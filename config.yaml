# Configuration for house price prediction model

data:
  raw_path: "data/ameshousing.csv"
  cleaned_path: "data/ameshousing_cleaned.csv"
  target_column: "medv"
  outlier_threshold: 45

model:
  type: "RandomForestRegressor"
  params:
    n_estimators: 100
    max_depth: 15
    random_state: 42
    n_jobs: -1

train:
  test_size: 0.2
  random_state: 42

api:
  host: "0.0.0.0"
  port: 8000
  title: "House Price Prediction API"
  description: "ML model to predict house prices"
  version: "1.0.0"

output:
  model_dir: "models/"
  features_count: 18