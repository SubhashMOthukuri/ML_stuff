server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html — Vite rewrites asset hashes on every build,
    # so a stale index.html will reference deleted bundle files (→ blank page).
    # Both exact-match rules cover two cases: user visits / or /index.html directly.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # Hashed assets are content-addressed → safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React router — serve index.html for all non-asset paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the backend service.
    location /api/ {
        proxy_pass http://nyc-airbnb/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key "${NGINX_API_KEY}";
    }
}
