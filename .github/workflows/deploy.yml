name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'requirements*.txt'
      - 'infra/helm/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Download models from S3
        run: aws s3 sync s3://nyc-airbnb-models-698172256228/nyc/ models/nyc/

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -x -q --tb=short

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download models from S3
        run: aws s3 sync s3://nyc-airbnb-models-698172256228/nyc/ models/nyc/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend (multi-arch)
        run: |
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            -t 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb:${{ steps.tag.outputs.tag }} \
            -t 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb:latest \
            --push \
            .

      - name: Scan backend image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: 1
          severity: CRITICAL

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend
        run: |
          docker build \
            --platform linux/amd64 \
            -t 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb-frontend:${{ steps.tag.outputs.tag }} \
            -t 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb-frontend:latest \
            frontend/
          docker push 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb-frontend:${{ steps.tag.outputs.tag }}
          docker push 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb-frontend:latest

      - name: Scan frontend image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb-frontend:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: 1
          severity: CRITICAL

  update-image-tag:
    name: Update Helm values & trigger ArgoCD
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update image tags in values.yaml
        run: |
          API_TAG=${{ needs.build-backend.outputs.image_tag }}
          FE_TAG=${{ needs.build-frontend.outputs.image_tag }}
          # 2-space indent = API image tag; 4-space indent = frontend image tag
          sed -i "s|^  tag: .*|  tag: $API_TAG|" infra/helm/nyc-airbnb/values.yaml
          sed -i "s|^    tag: .*|    tag: $FE_TAG|" infra/helm/nyc-airbnb/values.yaml

      - name: Commit & push updated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/nyc-airbnb/values.yaml
          git diff --staged --quiet || git commit -m "chore(deploy): update image tag to ${{ needs.build-backend.outputs.image_tag }} [skip ci]"
          git push
