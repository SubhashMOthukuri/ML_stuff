name: Nightly Drift Check + Conditional Retrain

on:
  schedule:
    - cron: '0 2 * * *'      # 2 AM UTC every night
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      force_retrain:
        description: 'Force retraining even if no drift detected'
        required: false
        default: 'false'
      rollback_version:
        description: 'MLflow version to rollback to (leave empty to skip)'
        required: false

env:
  PYTHONPATH: .
  MLFLOW_ARTIFACT_ROOT: "s3://nyc-airbnb-models-698172256228/mlflow/"

jobs:

  # ── Job 1: Drift check against live production API ───────────────────────────
  # Calls GET /drift on the running cluster — drift runs against real prediction
  # data in Postgres, not a CI-local empty SQLite file.
  # Requires two secrets: PROD_API_URL and PROD_API_KEY.
  drift-check:
    name: Drift Check (prod API)
    runs-on: ubuntu-latest
    outputs:
      drift_status: ${{ steps.check.outputs.drift_status }}
      drift_alerts: ${{ steps.check.outputs.drift_alerts }}

    steps:
      - uses: actions/checkout@v4

      - name: Check production drift
        id: check
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "PROD_API_URL secret not set — drift check skipped"
            echo "drift_status=skipped" >> $GITHUB_OUTPUT
            echo "drift_alerts=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          RESPONSE=$(curl -sf --max-time 30 \
            -H "X-API-Key: $PROD_API_KEY" \
            "${PROD_API_URL}/drift?window_hours=168&push_alert=true") || {
            echo "Production API unreachable — drift check skipped"
            echo "drift_status=api_unreachable" >> $GITHUB_OUTPUT
            echo "drift_alerts=none" >> $GITHUB_OUTPUT
            exit 0
          }

          echo "$RESPONSE" | tee drift_report.json

          STATUS=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))")
          ALERTS=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); alerts=d.get('alerts',[]); print(' | '.join(alerts) if alerts else 'none')")

          echo "drift_status=$STATUS" >> $GITHUB_OUTPUT
          echo "drift_alerts=$ALERTS"  >> $GITHUB_OUTPUT
          echo "Drift status: $STATUS"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.json
          if-no-files-found: ignore

      - name: Create GitHub issue on critical drift
        if: steps.check.outputs.drift_status == 'critical'
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = '${{ steps.check.outputs.drift_alerts }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: '🚨 Production drift detected — retraining triggered',
              body:  `## Drift Report\n\n**Status:** critical\n\n**Alerts:**\n${alerts.split(' | ').map(a => '- ' + a).join('\n')}\n\n**Action:** Nightly retraining pipeline triggered automatically.\nIf retraining gate passes, model will be promoted. If it fails, model stays unchanged and this issue stays open.\n\n*Generated by nightly drift check ${new Date().toISOString()}*`,
              labels: ['drift', 'automated', 'ml-ops'],
            });

  # ── Job 2: Conditional retrain ────────────────────────────────────────────────
  retrain:
    name: Retrain + Validate
    needs: drift-check
    runs-on: ubuntu-latest
    # Run if: drift is critical, OR force_retrain was set manually
    if: |
      needs.drift-check.outputs.drift_status == 'critical' ||
      github.event.inputs.force_retrain == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-2

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Download current champion model + baseline from S3
        run: aws s3 sync s3://nyc-airbnb-models-698172256228/nyc/ models/nyc/

      - name: Rollback (if requested)
        if: github.event.inputs.rollback_version != ''
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/retrain.py --rollback ${{ github.event.inputs.rollback_version }}
          aws s3 sync models/nyc/ s3://nyc-airbnb-models-698172256228/nyc/

      - name: Run retraining pipeline (S3 snapshot, date-rotated)
        if: github.event.inputs.rollback_version == ''
        id: retrain
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          FORCE_FLAG=${{ github.event.inputs.force_retrain == 'true' && '--force' || '' }}
          python scripts/retrain.py --s3-snapshot --skip-optuna $FORCE_FLAG
          echo "retrain_status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Push promoted model to S3 (only on gate pass)
        if: steps.retrain.outputs.retrain_status == 'success'
        run: aws s3 sync models/nyc/ s3://nyc-airbnb-models-698172256228/nyc/

      - name: Comment on drift issue if retrain failed
        if: steps.retrain.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'drift',
              state:  'open',
            });
            if (issues.data.length > 0) {
              github.rest.issues.createComment({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                issue_number: issues.data[0].number,
                body: '⚠️ Retraining triggered but **validation gate failed**. Current production model unchanged. Manual investigation required.',
              });
            }
