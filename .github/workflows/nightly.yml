name: Nightly Drift Check + Conditional Retrain

on:
  schedule:
    - cron: '0 2 * * *'      # 2 AM UTC every night
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      force_retrain:
        description: 'Force retraining even if no drift detected'
        required: false
        default: 'false'
      rollback_version:
        description: 'MLflow version to rollback to (leave empty to skip)'
        required: false

env:
  PYTHONPATH: .
  PREDICTION_DB: data/predictions.db
  MLFLOW_TRACKING_URI: mlruns

jobs:

  # ── Job 1: Drift check ───────────────────────────────────────────────────────
  drift-check:
    name: Drift Check
    runs-on: ubuntu-latest
    outputs:
      drift_status: ${{ steps.check.outputs.drift_status }}
      drift_alerts: ${{ steps.check.outputs.drift_alerts }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Download prediction database from production
        # In a real deployment, pull the predictions.db from production server
        # e.g.: scp user@prod:/app/data/predictions.db data/predictions.db
        # For now we check if it exists locally
        run: |
          mkdir -p data
          if [ ! -f data/predictions.db ]; then
            echo "No prediction database found — creating empty one for drift check"
            python3 -c "
          import sqlite3, pathlib
          db = sqlite3.connect('data/predictions.db')
          db.close()
            "
          fi

      - name: Run drift check
        id: check
        run: |
          python3 - <<'EOF'
          import sys, json
          sys.path.insert(0, '.')
          from src.new_york_workflow.nyc_drift import DriftMonitor
          monitor = DriftMonitor()
          report  = monitor.check(window_hours=168)
          print(json.dumps(report.to_dict(), indent=2))

          with open('drift_report.json', 'w') as f:
              json.dump(report.to_dict(), f, indent=2)

          print(f'::set-output name=drift_status::{report.status}')
          alerts_str = ' | '.join(report.alerts) if report.alerts else 'none'
          print(f'::set-output name=drift_alerts::{alerts_str}')

          if report.status == 'critical':
              print('DRIFT CRITICAL — will trigger retraining')
              sys.exit(0)
          elif report.status == 'warning':
              print('DRIFT WARNING — monitoring, no retraining yet')
              sys.exit(0)
          else:
              print('No drift detected')
          EOF

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.json

      - name: Create GitHub issue on critical drift
        if: steps.check.outputs.drift_status == 'critical'
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = '${{ steps.check.outputs.drift_alerts }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: '🚨 Production drift detected — retraining triggered',
              body:  `## Drift Report\n\n**Status:** critical\n\n**Alerts:**\n${alerts.split(' | ').map(a => '- ' + a).join('\n')}\n\n**Action:** Nightly retraining pipeline triggered automatically.\nIf retraining gate passes, model will be promoted. If it fails, model stays unchanged and this issue stays open.\n\n*Generated by nightly drift check ${new Date().toISOString()}*`,
              labels: ['drift', 'automated', 'ml-ops'],
            });

  # ── Job 2: Conditional retrain ────────────────────────────────────────────────
  retrain:
    name: Retrain + Validate
    needs: drift-check
    runs-on: ubuntu-latest
    # Run if: drift is critical, OR force_retrain was set manually
    if: |
      needs.drift-check.outputs.drift_status == 'critical' ||
      github.event.inputs.force_retrain == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Rollback (if requested)
        if: github.event.inputs.rollback_version != ''
        run: |
          python scripts/retrain.py --rollback ${{ github.event.inputs.rollback_version }}

      - name: Run retraining pipeline
        if: github.event.inputs.rollback_version == ''
        id: retrain
        run: |
          # retrain.py downloads the latest InsideAirbnb NYC snapshot automatically,
          # runs it through the production cleaning + feature engineering pipeline,
          # then trains and validates. Pass --no-download to use existing data instead.
          python scripts/retrain.py ${{ github.event.inputs.force_retrain == 'true' && '--force' || '' }}
          echo "::set-output name=retrain_status::success"
        continue-on-error: true

      - name: Upload new model artifacts
        if: steps.retrain.outputs.retrain_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/nyc/nyc_xgb_model.pkl
            models/nyc/nyc_xgb_model.onnx
            models/nyc/nyc_scaler.pkl
            models/nyc/baseline_stats.json

      - name: Comment on drift issue if retrain failed
        if: steps.retrain.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'drift',
              state:  'open',
            });
            if (issues.data.length > 0) {
              github.rest.issues.createComment({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                issue_number: issues.data[0].number,
                body: '⚠️ Retraining triggered but **validation gate failed**. Current Production model unchanged. Manual investigation required.',
              });
            }
