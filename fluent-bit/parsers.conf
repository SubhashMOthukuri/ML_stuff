# Fluent Bit parsers for nyc-api
#
# json_log: parses the raw JSON line that structlog emits to stdout.
# Docker's fluentd driver wraps stdout in a `log` field; the parser
# filter in fluent-bit.conf unpacks it using this definition.

[PARSER]
    Name        json_log
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
