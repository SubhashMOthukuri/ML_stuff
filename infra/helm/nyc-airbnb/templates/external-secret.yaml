# ClusterSecretStore is intentionally NOT defined here.
# It is cluster-scoped and managed via infra/k8s/cluster-secret-store.yaml
# (IRSA / JWT auth). Defining it here with static keys would overwrite that
# and downgrade security on every Helm upgrade.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyc-airbnb-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: nyc-airbnb-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nyc-airbnb/prod
