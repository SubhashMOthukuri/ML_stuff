apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pushgateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pushgateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pushgateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.8.0
          ports:
            - containerPort: 9091
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pushgateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-pushgateway
  ports:
    - port: 9091
      targetPort: 9091
