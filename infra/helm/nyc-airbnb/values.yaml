image:
  repository: 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb
  tag: f59104a
  pullPolicy: Always

replicaCount: 1

service:
  type: LoadBalancer
  port: 80
  targetPort: 8001

resources:
  requests:
    cpu: 250m
    memory: 900Mi
  limits:
    cpu: 1000m
    memory: 1800Mi

env:
  LOG_FORMAT: json
  LOG_LEVEL: info
  RATE_LIMIT: "100/minute"
  GUNICORN_WORKERS: "2"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # OTLP_ENDPOINT intentionally unset — otel-collector not deployed yet.
  # App falls back to console exporter (no error spam). Wire in when collector is installed.
  OTEL_SERVICE_NAME: nyc-airbnb
  MLFLOW_ARTIFACT_ROOT: "s3://nyc-airbnb-models-698172256228/mlflow/"
  DD_ENV: prod
  DD_SERVICE: nyc-airbnb
  # Set to the frontend LoadBalancer hostname once assigned, e.g.:
  #   CORS_ALLOW_ORIGINS: "http://a1b2c3.elb.amazonaws.com"
  # Frontend nginx proxies /api/* so browser never calls the API directly —
  # this only matters for external callers (Swagger UI, direct API consumers).
  CORS_ALLOW_ORIGINS: "*"
  # PREDICTION_DB, SHADOW_DB_URL, MLFLOW_TRACKING_URI injected from nyc-airbnb-secrets (ESO → Secrets Manager)

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  maxmemory: "256mb"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

hpa:
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

secretName: nyc-airbnb-secrets

# Prometheus operator ServiceMonitor label — must match the operator's serviceMonitorSelector.
# Run: kubectl get prometheuses -A -o jsonpath='{..serviceMonitorSelector}' to verify.
prometheusRelease: kube-prometheus

frontend:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 3
  image:
    repository: 698172256228.dkr.ecr.us-east-2.amazonaws.com/nyc-airbnb-frontend
    tag: e935b75
