apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyc-airbnb-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: nyc-airbnb-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nyc-airbnb/prod
