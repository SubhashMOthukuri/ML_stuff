apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nyc-airbnb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SubhashMOthukuri/ML_stuff.git
    targetRevision: main
    path: infra/helm/nyc-airbnb
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
