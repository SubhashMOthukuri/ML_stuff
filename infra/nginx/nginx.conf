# NYC Airbnb API — Nginx reverse proxy
#
# Responsibilities:
#   - SSL termination (HTTPS on :443, redirect HTTP :80 → HTTPS)
#   - Per-IP rate limiting (burst protection before traffic reaches Python)
#   - Upstream load balancing across gunicorn workers
#   - Pass X-Request-ID from Nginx to FastAPI for distributed tracing
#   - Security headers (HSTS, X-Frame-Options, Content-Security-Policy)
#
# Docker usage:
#   Nginx container listens on 80/443; upstream is the API container on port 8001.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$request_id '
                    'rt=$request_time ut="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;    # hide Nginx version from attackers

    # ── rate limiting ─────────────────────────────────────────────────────────
    # 10 r/s per IP; burst of 20 allows short spikes without dropping requests
    limit_req_zone  $binary_remote_addr  zone=api:10m  rate=10r/s;
    limit_req_status 429;

    # ── upstream (gunicorn running inside the api container) ──────────────────
    upstream nyc_api {
        server api:8001;

        # If scaling horizontally, add more servers:
        # server api2:8001;
        # server api3:8001;

        keepalive 64;    # connection pool to gunicorn
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }

        # Allow Let's Encrypt ACME challenge through HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # SSL certs (self-signed for dev; swap for Let's Encrypt in prod)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Modern TLS — disable SSLv3 / TLS 1.0 / 1.1
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;

        # ── API proxy ─────────────────────────────────────────────────────────
        location / {
            # Nginx-generated request ID — forwarded to FastAPI → OTel spans
            set $rid $request_id;
            if ($http_x_request_id) {
                set $rid $http_x_request_id;
            }

            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://nyc_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";      # enable keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $rid;

            proxy_connect_timeout  5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # Return the request ID in the response so clients can trace
            add_header X-Request-ID $rid always;
        }

        # ── health check endpoint — bypass rate limiting ───────────────────
        location /health {
            limit_req off;
            proxy_pass http://nyc_api/health;
            proxy_set_header Host $host;
        }

        location /health/ready {
            limit_req off;
            proxy_pass http://nyc_api/health/ready;
            proxy_set_header Host $host;
        }

        location /health/live {
            limit_req off;
            proxy_pass http://nyc_api/health/live;
            proxy_set_header Host $host;
        }
    }
}
