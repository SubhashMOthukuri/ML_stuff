# Fluent Bit — nyc-api log shipper
#
# Pipeline:
#   [INPUT  forward:24224]  ← Docker fluentd log driver
#   [FILTER parse JSON    ]  ← unpack structlog JSON from the `log` field
#   [FILTER add host tag  ]
#   [OUTPUT Datadog       ]  ← http-intake.logs.datadoghq.com
#
# ELK alternative: replace [OUTPUT] with the elasticsearch plugin and
# point Host/Port at your Logstash or Elasticsearch ingest node.

[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     warn
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ── Input: Docker fluentd log driver ──────────────────────────────────────────
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# ── Filter: parse structlog JSON from the raw `log` string ────────────────────
[FILTER]
    Name          parser
    Match         nyc-api.*
    Key_Name      log
    Parser        json_log
    Reserve_Data  On
    Preserve_Key  Off

# ── Filter: stamp every record with the Fluent Bit host ───────────────────────
[FILTER]
    Name    record_modifier
    Match   *
    Record  fb_host ${HOSTNAME}

# ── Output: Datadog Log Intake ────────────────────────────────────────────────
[OUTPUT]
    Name        datadog
    Match       *
    Host        ${DD_INTAKE_HOST}
    TLS         on
    compress    gzip
    apikey      ${DD_API_KEY}
    dd_service  ${DD_SERVICE}
    dd_source   python
    dd_tags     env:${DD_ENV}
